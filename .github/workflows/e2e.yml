name: E2E Tests

on:
  # Run manually from the GitHub Actions UI, optionally overriding the target URL.
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Frontend URL to test against (overrides the E2E_BASE_URL secret)'
        required: false
        type: string
      api_url:
        description: 'API URL to test against (overrides the E2E_API_URL secret)'
        required: false
        type: string

  # Also run automatically after a successful production deploy.
  workflow_run:
    workflows: ['CI / CD']
    types: [completed]
    branches: [main]

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest

    # When triggered by workflow_run, only run if the upstream workflow succeeded.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browsers (Chromium only)
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        env:
          # Prefer explicit workflow input; fall back to the repository secret.
          E2E_BASE_URL: ${{ inputs.base_url || secrets.E2E_BASE_URL }}
          E2E_API_URL: ${{ inputs.api_url || secrets.E2E_API_URL }}
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
