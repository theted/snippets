name: Node.js CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    # react-query v3 declares peer deps for React ≤18; --legacy-peer-deps
    # silences the conflict (it works fine at runtime with React 19).
    - run: npm ci --legacy-peer-deps
    - run: npm run build
    - run: npm test -- --run
