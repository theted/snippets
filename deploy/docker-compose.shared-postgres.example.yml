version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: snippets
      POSTGRES_USER: snippets
      POSTGRES_PASSWORD: change-me
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    networks:
      shared-services:
        aliases:
          - shared-postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snippets -d snippets"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

networks:
  shared-services:
    external: true
    name: shared-services
