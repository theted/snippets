server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API requests to the API container on the Docker internal network.
    # Strips the /api prefix: /api/snippets → http://api:3200/snippets
    location /api/ {
        proxy_pass http://api:3200/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # React SPA — fall back to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
