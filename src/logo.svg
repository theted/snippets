<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <radialGradient id="bgGlow" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#1b2d4a"/>
      <stop offset="100%" stop-color="#0d1420"/>
    </radialGradient>
    <linearGradient id="bracketGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a2d4ff"/>
      <stop offset="100%" stop-color="#5b9cf5"/>
    </linearGradient>
    <linearGradient id="slashGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7dc4fa"/>
      <stop offset="100%" stop-color="#3d7ae0"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="120" height="120" rx="22" fill="url(#bgGlow)"/>
  <rect width="120" height="120" rx="22" fill="none" stroke="rgba(125,196,250,0.12)" stroke-width="1.5"/>

  <!-- < bracket -->
  <path d="M41 22L15 60L41 98"
        stroke="url(#bracketGrad)" stroke-width="10"
        stroke-linecap="round" stroke-linejoin="round"
        fill="none" filter="url(#glow)"/>

  <!-- > bracket -->
  <path d="M79 22L105 60L79 98"
        stroke="url(#bracketGrad)" stroke-width="10"
        stroke-linecap="round" stroke-linejoin="round"
        fill="none" filter="url(#glow)"/>

  <!-- / slash -->
  <line x1="72" y1="22" x2="48" y2="98"
        stroke="url(#slashGrad)" stroke-width="9"
        stroke-linecap="round" filter="url(#glow)"/>
</svg>
